name: tests

on:
  push:
    branches: [main, '1.x', 'release/**']
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        stability: [prefer-stable]
        include:
          # Testbench 9.0–9.1 breaks on Laravel 11.15+ (the lowest Larastan 3 allows).
          - laravel: '11'
            testbench: '^9.2'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
          # Lowest dependencies only on the lowest PHP each Laravel supports.
          - { php: '8.2', laravel: '11', testbench: '^9.2', stability: prefer-lowest }
          - { php: '8.2', laravel: '12', testbench: '^10.0', stability: prefer-lowest }
          - { php: '8.3', laravel: '13', testbench: '^11.0', stability: prefer-lowest }
        exclude:
          - laravel: '13'
            php: '8.2'

    env:
      # Laravel 11 is past its security support window, every release has open advisories.
      # Keep testing it while existing users are still on it.
      COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.laravel == '11' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint
        run: vendor/bin/pint --test
